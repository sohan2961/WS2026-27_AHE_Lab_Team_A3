name: Host software validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run C++/NumPy reference checks
        run: bash scripts/run_host_test.sh && bash scripts/run_host_attention.sh
      - name: Run first VHDL-independent arithmetic reference
        run: python reference/check_dot_product.py
  rtl-dot-product:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install VHDL simulator
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Simulate first RTL dot product
        run: bash scripts/run_ghdl.sh
